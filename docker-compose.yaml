version: '3.8'

services:
  client:
    build:
      context: ./client
    ports:
      - "3000:3000"
    depends_on:
      - server
    environment:
      - REACT_APP_API_URL=http://server:8080

  server:
    build:
      context: ./server
    ports:
      - "8080:8080"
    environment:
      - CORS_ALLOWED_ORIGINS=*
